name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  cpu-baseline:
    name: Linux x86-64 CPU baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libssl-dev libclang-dev
      - name: Show the C/C++ toolchain
        run: |
          env | grep -E 'FLAGS|^CC|^CXX' || true
          type -a cc c++ gcc g++
          c++ --version
          c++ -Q --help=target | grep -E '^\s+-march=|^\s+-mavx2 |^\s+-mfma '
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Show the flags the build used
        if: always()
        run: grep -hE '^(CFLAGS|CXXFLAGS|CC|CXX|RUSTFLAGS)[^ ]* = ' target/x86_64-unknown-linux-gnu/release/build/signalsmith-stretch-*/output || true
      - run: scripts/check-cpu-baseline.sh target/x86_64-unknown-linux-gnu/release/pinepods_firewood
