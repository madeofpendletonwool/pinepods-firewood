[package]
name = "pinepods_firewood"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal client for PinePods"
license = "GPL-3.0-only"
repository = "https://github.com/madeofpendletonwool/pinepods-firewood"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3.4"
html2text = "0.17.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
keyring = "4.2.0"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", features = ["json", "query", "gzip"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signalsmith-stretch = "0.1.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "0.9.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
urlencoding = "2.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[dev-dependencies]
wiremock = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSValue", "NSGeometry"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"
