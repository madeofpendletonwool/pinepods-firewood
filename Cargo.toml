[package]
name = "pinepods_firewood"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal client for PinePods"
repository = "https://github.com/madeofpendletonwool/pinepods-firewood"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
keyring = "4.2.0"
ratatui = { version = "0.30.2", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "query", "gzip"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signalsmith-stretch = "0.1.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
toml = "0.9.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
urlencoding = "2.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[dev-dependencies]
wiremock = "0.6.5"
